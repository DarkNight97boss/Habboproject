<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/habbo/assets/images/favicon.08c747be.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#0c3a65" />
    <meta name="description" content="Asteria — l'hotel virtuale italiano della community" />
    <title>Asteria — Hotel virtuale italiano</title>

    <!--
        SKIN PRE-HYDRATION — anti-FOUC critico.

        Lo skin attivo è in localStorage (`cms-v3-skin-cache`, scritto da
        applySkin al primo fetch /api/v2/site/skin). Lo leggiamo SUBITO,
        PRIMA del CSS habbo.it, e impostiamo `data-skin` su <html> +
        background body al colore cosmic, così l'utente non vede flash blu
        Habbo prima che React monti.

        Se è il primo accesso (cache vuota) non possiamo sapere lo skin
        attivo finché /api/v2/site/skin non risponde, quindi default a
        background NEUTRO scuro che vale per tutti gli skin moderni.
    -->
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('cms-v3-skin-cache');
                if (raw) {
                    var m = JSON.parse(raw);
                    if (m && m.meta && m.meta.slug) {
                        document.documentElement.setAttribute('data-skin', m.meta.slug);
                        if (m.layout && m.layout.variant) {
                            document.documentElement.setAttribute('data-layout', m.layout.variant);
                        }
                        if (m.meta.slug === 'asteria-nebula') {
                            document.documentElement.style.backgroundColor = '#050511';
                        }
                    }
                }
            } catch (e) { /* silent: fallback al default */ }
        })();
    </script>
    <style>
        /* Anti-FOUC: se siamo in skin Asteria, nascondi qualunque DOM habbo.it
           (header-small, wrapper) finché React non ha montato AsteriaShell.
           AsteriaShell aggiunge body.asteria-mounted al primo render. */
        html[data-skin="asteria-nebula"] { background: #050511 !important; }
        html[data-skin="asteria-nebula"] body { background: #050511 !important; color: #f1f5f9; }
        html[data-skin="asteria-nebula"] body:not(.asteria-mounted) > div:not(#root),
        html[data-skin="asteria-nebula"] body:not(.asteria-mounted) habbo-header-small,
        html[data-skin="asteria-nebula"] body:not(.asteria-mounted) habbo-header-large,
        html[data-skin="asteria-nebula"] body:not(.asteria-mounted) habbo-footer,
        html[data-skin="asteria-nebula"] body:not(.asteria-mounted) habbo-web-pages {
            visibility: hidden !important;
        }
        /* Mini loader gradient sotto il root per ~300ms se React tarda a montare */
        html[data-skin="asteria-nebula"] body:not(.asteria-mounted) #root::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 0% 0%, rgba(168,85,247,0.30) 0%, transparent 60%),
                radial-gradient(ellipse at 100% 100%, rgba(6,182,212,0.20) 0%, transparent 60%),
                #050511;
            z-index: 0;
        }
    </style>

    <!--
        Tutti gli asset chrome (CSS + sprite + background + font + favicon)
        sono mirrorati in locale sotto /assets/habbo/. Vedi
        `apps/web/scripts/download-habbo-assets.mjs`:
        scarica da images.habbo.com, riscrive le url() assolute della CSS
        in path relativi locali, preserva la folder structure così le url()
        relative continuano a risolvere.
        Rigenera con `yarn workspace @cms-v3/web download-assets`.
    -->
    <link rel="prefetch" href="/assets/habbo/assets/images/sprite.275ed2fd.png" />
    <link rel="prefetch" href="/assets/habbo/assets/images/sprite@2x.f98bb62b.png" media="(-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi), (min-resolution: 2dppx)" />
    <link rel="prefetch" href="/assets/habbo/assets/images/backgrounds/hotel.c5bc8f85.png" />
    <link rel="stylesheet" href="/assets/habbo/app.css" />

    <!-- Override leggeri specifici Habboproject (caricati DOPO la CSS ufficiale per priorità). -->
    <link rel="stylesheet" href="/src/styles/overrides.css" />
</head>
<body class="">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
