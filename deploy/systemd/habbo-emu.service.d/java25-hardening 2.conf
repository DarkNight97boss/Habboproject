# =============================================================================
# Drop-in systemd per l'EMU su Java 25 - vale per habbo-emu (prod) e
# habbo-emu-dev (dev): installarlo in
#   /etc/systemd/system/habbo-emu.service.d/java25-hardening.conf
#   /etc/systemd/system/habbo-emu-dev.service.d/java25-hardening.conf
# poi `systemctl daemon-reload` e restart della unit. Non tocca ExecStart:
# le flag JVM passano da JDK_JAVA_OPTIONS (lette dal launcher `java`, JDK 9+).
#
# Perche' (verificato col workflow vps-diag il 2026-09-15):
#   --enable-native-access=ALL-UNNAMED
#       JDK 24+ (JEP 472): Netty carica la libreria epoll con System::loadLibrary
#       e jansi usa JNI -> oggi WARNING "restricted method", in una release futura
#       ERRORE all'avvio. Dichiararlo esplicitamente = niente sorprese all'upgrade.
#   -Djdk.serialFilter=!*
#       Filtro globale di deserializzazione (JEP 290): l'EMU non usa MAI
#       ObjectInputStream (0 occorrenze nel sorgente), quindi qualsiasi tentativo
#       di deserializzare oggetti Java (gadget chain) viene rifiutato. Costo zero.
#   -XX:+ExitOnOutOfMemoryError
#       Dopo un OOM la JVM non deve continuare in stato inconsistente: esce
#       (dopo l'eventuale heap dump) e systemd la riavvia (Restart=on-failure).
#   UMask=0077
#       Log e heap dump (che contengono password DB/token in memoria) nascono
#       leggibili solo dall'utente asteria.
#   Sandbox aggiuntiva: nessuna capability, solo socket IP/unix, niente
#       namespace/realtime/setuid, syscall della classe @system-service.
#       MemoryDenyWriteExecute NON va usato: il JIT della JVM richiede W+X.
# =============================================================================
[Service]
Environment=JDK_JAVA_OPTIONS=--enable-native-access=ALL-UNNAMED -Djdk.serialFilter=!* -XX:+ExitOnOutOfMemoryError
UMask=0077
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
ProtectClock=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectProc=invisible
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
