# Cloudflare cache purge — automatico dopo un deploy andato a buon fine.
#
# Si attiva via `workflow_run` quando "PR - Deploy DEV" o "Production Deploy"
# completano con conclusion=success, e purga la cache Cloudflare degli
# entrypoint HTML degli hostname dell'ambiente. Gli asset hashati da Vite sono
# immutabili (cambiano nome a ogni build) → basta purgare la shell HTML, NON
# serve purge_everything (che colpirebbe anche prod durante un deploy dev).
#
# Purge "by files" funziona su tutti i piani Cloudflare (no Enterprise).
# Usa il token scoped CF_API_TOKEN (Cache Purge + Zone Read).
#
# NB: i trigger workflow_run si attivano solo quando questo file è su main.

name: CF Cache Purge

on:
  workflow_run:
    workflows:
      - "PR - Deploy DEV (dev.asteriacore.online)"
      - "Production Deploy"
    types: [ completed ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente di cui purgare la cache'
        type: choice
        options: [ dev, prod ]
        default: dev

permissions:
  contents: read

jobs:
  purge:
    name: Purge Cloudflare cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Solo se il deploy è andato bene (o trigger manuale).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Risolvi ambiente e hostname
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${{ github.event.workflow_run.name }}" = "Production Deploy" ]; then
            TARGET="prod"
          else
            TARGET="dev"
          fi
          if [ "$TARGET" = "prod" ]; then
            HOSTS="asteriacore.online api.asteriacore.online hotel.asteriacore.online"
          else
            HOSTS="dev.asteriacore.online dev-api.asteriacore.online dev-hotel.asteriacore.online"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "hosts=$HOSTS"   >> "$GITHUB_OUTPUT"
          echo "Purging cache per ambiente: $TARGET"

      - name: Purge entrypoints (Cloudflare API)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          # Lista URL entrypoint (root + index.html) per ogni host → JSON {files:[...]}.
          FILES=$(for h in ${{ steps.t.outputs.hosts }}; do
                    printf '%s\n%s\n' "https://$h/" "https://$h/index.html"
                  done | jq -R . | jq -sc .)
          BODY=$(jq -nc --argjson files "$FILES" '{files: $files}')
          echo "Payload: $BODY"
          RESP=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          echo "$RESP"
          echo "$RESP" | jq -e '.success == true' >/dev/null \
            || { echo "::error::Cloudflare cache purge fallito"; exit 1; }
          echo "::notice::Cache Cloudflare purgata per ${{ steps.t.outputs.target }}"
