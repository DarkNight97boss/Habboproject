# Dependabot config — apre PR settimanali per aggiornare dipendenze
# con CVE noti o major/minor disponibili.
#
# Doc: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategia:
#  - Maven (EMU/pom.xml): scansione settimanale, security-update prioritizzato.
#  - npm/yarn (CMS-V3, workspaces): settimanale, minor+patch aggregati per
#    prod e dev, major separati.
#  - GitHub Actions (.github/workflows/*.yml): scansione mensile.
#  - Cap per-ecosystem sulle PR aperte per non saturare la review queue.
#  - Group: minor+patch aggregati, major separati (rischio breaking).

version: 2
updates:
  # ----- Maven (Arcturus EMU) -----
  - package-ecosystem: "maven"
    directory: "/EMU"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(emu)"
      include: "scope"
    groups:
      netty:
        patterns:
          - "io.netty:*"
      logging:
        patterns:
          - "ch.qos.logback:*"
          - "org.slf4j:*"
      jdbc:
        patterns:
          - "mysql:mysql-connector-*"
          - "com.zaxxer:HikariCP"
      minor-and-patch:
        # Tutto il resto: solo minor+patch in un PR aggregato.
        # Major bump escono come PR separati per facilita' di review.
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Caffeine 3.x richiede Java 11 runtime (siamo su Java 8 target).
      - dependency-name: "com.github.ben-manes.caffeine:caffeine"
        versions: [">=3.0.0"]
      # HikariCP 4.x richiede Java 11 runtime.
      - dependency-name: "com.zaxxer:HikariCP"
        versions: [">=4.0.0"]
      # logback 1.3+ richiede slf4j 2.x (l'EMU usa slf4j 1.7). La 1.2.13 ha
      # già le fix CVE-2023-6378 + CVE-2021-42550, quindi restiamo sulla 1.2.x.
      - dependency-name: "ch.qos.logback:logback-classic"
        versions: [">=1.3.0"]

  # ----- npm / yarn (CMS-V3: Hono API + Vite/React web · yarn workspaces) -----
  # Singolo yarn.lock alla radice di CMS-V3 (workspaces hoisted) → 1 sola entry
  # che copre apps/* e packages/*.
  - package-ecosystem: "npm"
    directory: "/CMS-V3"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "cms"
    commit-message:
      prefix: "deps(cms)"
      include: "scope"
    groups:
      # Minor+patch aggregati (basso rischio) in 2 PR: produzione e sviluppo.
      # I major escono come PR separati (rischio breaking: React 19, Vite, Hono…).
      cms-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      cms-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # ----- GitHub Actions workflows -----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
