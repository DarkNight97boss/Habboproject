# CodeQL static analysis per Java.
#
# Gira a ogni push su main + ogni PR + settimanale (drift detection sui
# CVE che escono dopo la nostra patch). I finding appaiono in Security ->
# Code scanning alerts sul repo GitHub.
#
# Costo: 0 per repo pubblici. Tempo medio per run: ~6-8 min su questo
# codebase (~1800 file Java).
#
# Strategia query suite:
#   - default + security-extended (vale i bug "ad alto rumore" come
#     hardcoded password / weak crypto che la default skip-pa).
#   - language: java-kotlin (CodeQL ha unificato i due nel 2024).

name: CodeQL

on:
  push:
    branches: [ "main" ]
    paths:
      - 'EMU/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'EMU/**'
  schedule:
    # Lunedi alle 06:00 UTC (08:00 Roma). Cattura CVE pubblicate
    # nel weekend prima che le veda l'utente.
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality

      - name: Build EMU
        run: |
          cd EMU
          mvn -B -DskipTests -Dmaven.javadoc.skip=true package

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
