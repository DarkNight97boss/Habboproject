# =========================================================================
# Asteria Core — nginx config
# Cloudflare Tunnel forward all traffic to localhost:80 → nginx routes by
# server_name. Niente TLS qui: Cloudflare termina TLS, tunnel = trusted.
# =========================================================================

# Real IP from Cloudflare Tunnel (loopback connection con header CF-Connecting-IP)
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# Rate limit zone (anti brute-force layer 7)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Logging custom (con real IP)
log_format asteria '$remote_addr - $http_cf_connecting_ip [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

# ===== Frontend statico (asteriacore.online + www) =====
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name asteriacore.online www.asteriacore.online;

    root /opt/habboproject/CMS-V3/apps/web/dist;
    index index.html;

    access_log /var/log/nginx/asteria-frontend.log asteria;
    error_log /var/log/nginx/asteria-frontend.error.log;

    # Asset statici con cache lunga (versionati con hash Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend SPA fallback    # Badge Sulake album1584 → proxy via images.habbo.com (fallback se client
    # cerca i badge sul nostro dominio anziche' direct su images.habbo.com).
    # Cache lunga (badge sono asset stabili Sulake).
    location ~ ^/c_images/album1584/(.+\.gif)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://images.habbo.com/c_images/album1584/$1;
        proxy_set_header Host images.habbo.com;
        proxy_ssl_server_name on;
        proxy_ssl_name images.habbo.com;
        proxy_hide_header Set-Cookie;
        proxy_buffering on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Asset-Origin "habbo.com-proxy" always;
        access_log off;
    }

    # Reverse proxy /api/ -> CMS-V3 API (127.0.0.1:8092).
    # Same-origin: il client React fa fetch('/api/v2/...') che risolve a
    # asteriacore.online/api/v2/... Same-origin evita CORS preflight e
    # garantisce cookie SameSite=lax (Set-Cookie su .asteriacore.online).
    # NB: api.asteriacore.online subdomain resta funzionante (server block
    # dedicato sotto) per chiamate cross-origin esplicite (es. SDK terzi).
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }


    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# ===== API (api.asteriacore.online) =====
server {
    listen 80;
    listen [::]:80;
    server_name api.asteriacore.online;

    access_log /var/log/nginx/asteria-api.log asteria;
    error_log /var/log/nginx/asteria-api.error.log;

    # Rate limit globale
    limit_req zone=api_general burst=50 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }

    # Login/register più severi (anti brute-force)
    location ~ ^/api/v2/auth/(login|register)$ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ===== EMU WebSocket (hotel.asteriacore.online) =====
server {
    listen 80;
    listen [::]:80;
    server_name hotel.asteriacore.online;

    access_log /var/log/nginx/asteria-hotel.log asteria;
    error_log /var/log/nginx/asteria-hotel.error.log;

    # WebSocket → EMU su porta 2096 (Nitro V3 default ws)
    location / {
        proxy_pass http://127.0.0.1:2096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        # Timeout lunghi per WebSocket persistenti
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}

# ===== CDN proxy (cdn.asteriacore.online → CF R2) =====
# Per ora placeholder, useremo direct CDN R2.
