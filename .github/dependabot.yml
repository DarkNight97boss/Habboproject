# Dependabot config — apre PR settimanali per aggiornare dipendenze
# con CVE noti o major/minor disponibili.
#
# Doc: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategia:
#  - Maven (EMU/pom.xml): scansione settimanale, security-update prioritizzato.
#  - GitHub Actions (.github/workflows/*.yml): scansione mensile.
#  - Cap a 5 PR aperte per ecosystem per non saturare la review queue.
#  - Group: minor+patch aggregati, major separati (rischio breaking).

version: 2
updates:
  # ----- Maven (Arcturus EMU) -----
  - package-ecosystem: "maven"
    directory: "/EMU"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(emu)"
      include: "scope"
    groups:
      netty:
        patterns:
          - "io.netty:*"
      logging:
        patterns:
          - "ch.qos.logback:*"
          - "org.slf4j:*"
      jdbc:
        patterns:
          - "mysql:mysql-connector-*"
          - "com.zaxxer:HikariCP"
      minor-and-patch:
        # Tutto il resto: solo minor+patch in un PR aggregato.
        # Major bump escono come PR separati per facilita' di review.
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Caffeine 3.x richiede Java 11 runtime (siamo su Java 8 target).
      - dependency-name: "com.github.ben-manes.caffeine:caffeine"
        versions: [">=3.0.0"]
      # HikariCP 4.x richiede Java 11 runtime.
      - dependency-name: "com.zaxxer:HikariCP"
        versions: [">=4.0.0"]

  # ----- GitHub Actions workflows -----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
