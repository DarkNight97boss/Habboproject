#Asteria Core 3.5.5 — fork ribrandizzato di Arcturus Morningstar (GPL-3.0)

#Database Configuration.
#SECURITY: Do NOT use the MySQL 'root' account. Create a dedicated user whose privileges are
#limited to this database, and set a strong, unique password before going to production.
db.hostname=db
db.port=3306
db.database=ms
db.username=habbo
db.password=loadtest_habbo_pw_disposable
db.params=
db.pool.minsize=25
db.pool.maxsize=100

#Game Configuration.
#Host IP. Most likely just 0.0.0.0 Use 127.0.0.1 if you want to play on LAN.
game.host=0.0.0.0
game.port=3000

#Networking / anti-flood (tutti opzionali; i default sono prudenti).
#Dimensione massima di un pacchetto in ingresso. Default 417792 (limite foto camera).
#Se NON usi la camera in-client puoi abbassarlo (es. 16384) per ridurre la superficie di abuso.
networking.packet.max.length=417792
#Rate limit per connessione: finestra (s), max pacchetti con lo stesso ID, max pacchetti TOTALI.
networking.ratelimit.reset.seconds=1
networking.ratelimit.max.per.id=10
networking.ratelimit.max.total=200
#Dopo quante finestre consecutive oltre il limite totale si disconnette il client (0 = mai).
networking.ratelimit.max.violations=10
#Anti-flood pre-login: max pacchetti e secondi concessi prima di autenticarsi (0 = disattivato).
networking.auth.max.packets=50
networking.auth.timeout.seconds=30
#Idle keepalive (anti-disconnect-too-soon). Il server invia un ping ogni
#"ping.seconds" e disconnette il client se NESSUN packet (ping, chat,
#movimento, ecc.) arriva entro "pong.seconds". Aumenta pong.seconds se i
#tuoi utenti giocano dietro reti lente o con tab in background.
#
#Funzionamento AFK: il client Nitro risponde automaticamente al ping
#server con un pong -> il pong resetta il timer -> il client AFK resta
#vivo INDEFINITAMENTE finche' il ping/pong loop funziona.
networking.idle.ping.seconds=45
networking.idle.pong.seconds=180
#Read-idle hard backstop: chiude il channel se NESSUN byte arriva sul
#socket entro N secondi. Difesa contro scenari in cui il ping/pong loop
#stesso e' rotto. Tienilo generoso (default 1800s = 30 min) per non
#kickare i giocatori AFK. Imposta 0 per disabilitare completamente.
networking.idle.read.seconds=1800
#Backpressure: dopo quanti packet outbound droppati CONSECUTIVAMENTE per
#buffer pieno il client viene chiuso. Default 50: tollera picchi
#transitori di broadcast room senza kickare. Abbassa solo se hai prove
#che un attaccante abusa di slow-loris.
networking.backpressure.drop.threshold=50

#Tuning per alta concorrenza (>3k utenti). Defaults sicuri ed efficaci; alza
#solo se profili e vedi colli di bottiglia specifici. Su macchine piccole
#(VPS test) puoi lasciare i valori cosi'.
#SO_RCVBUF kernel + RCVBUF_ALLOCATOR adattivo (min/initial/max). L'allocator
#adattivo dimensiona la read syscall in base al traffico (read piccole per
#chat/movement, drain grande per camera/inventory burst). Sostituisce il
#vecchio FixedRecvByteBufAllocator(4096) che a 10k+ generava un
#context-switch storm.
networking.so.rcvbuf.bytes=32768
networking.recv.allocator.min=512
networking.recv.allocator.initial=8192
networking.recv.allocator.max=65536
#SO_BACKLOG: listen queue del kernel. Default OS ~128 su Linux -> spesso
#satura sotto login storm/restart con migliaia di client che si riconnettono
#contemporaneamente (TCP RST prima ancora del handshake).
networking.so.backlog=4096
#Multi-threaded packet handler. ATTIVALO SOLO dopo testing approfondito sotto
#carico: con true i pacchetti vanno su un thread pool condiviso (non bloccano
#piu' l'EventLoop su query DB lente), MA due pacchetti dello STESSO client
#possono essere processati in parallelo -> handler non thread-safe potrebbero
#esibire race condition (ordini, trade, dupe). Raccomandato per >3k utenti
#simultanei DOPO aver verificato che gli handler critici siano thread-safe.
io.client.multithreaded.handler=false

#Max connessioni per IP (0 = illimitato). LASCIA 0 se sei dietro proxy/Cloudflare
#(l'IP del socket sarebbe quello del proxy): in quel caso limita per-IP sul proxy.
networking.max.connections.per.ip=0
#PROXY protocol: abilita SOLO se sei dietro un proxy TCP che antepone l'header PROXY
#(es. Cloudflare Spectrum con "Proxy Protocol" attivo). Con true l'EMU ricava l'IP reale
#dall'header e RIFIUTA le connessioni senza header (accetta cioe' solo traffico via proxy).
#Richiede un firewall che consenta il game port SOLO dagli IP del proxy.
networking.tcp.proxy=false

#RCON Configuration.
#RCON Host IP. Leave this at 127.0.0.1 if you're running your website on the same server as the emulator.
#SECURITY: keep rcon.host on 127.0.0.1, never expose rcon.port publicly, restrict it with a firewall.
#rcon.token adds a shared-secret check on top of the IP allow-list (empty = disabled). Set the SAME
#value here and in the CMS/API RCON config to require it.
#PRODUCTION: ALWAYS set rcon.token. Generate with:
#   openssl rand -hex 32       (Linux/macOS)
#   tools/gen_rcon_token.ps1    (Windows; in repo root)
#A 64-hex token is unguessable; without it any local process can talk RCON
#(in containerized envs the "127.0.0.1 only" guarantee evaporates).
rcon.host=127.0.0.1
rcon.port=3001
rcon.allowed=127.0.0.1;127.0.0.2
rcon.token=loadtest_rcon_token_disposable_0123456789

#Call For Help (segnalazioni player -> mod tool).
#Arcturus 3.5.5 ship-a SENZA il packet header del CFH player-side -> i giocatori
#non possono aprire ticket finche' non lo configuri qui. Trova il numero header
#nel tuo client Nitro (cerca CallForHelpMessageComposer -> header). Esempio
#tipico per build PROD-2015+: packet.header.cfh=1843. Con -1 il PacketManager
#non registra il handler e logga WARN a startup.
packet.header.cfh=-1
#Cooldown server-side fra ticket consecutivi dello stesso utente (anti-spam).
#Imposta 0 per disabilitare il cooldown (sconsigliato in produzione).
cfh.player.cooldown.seconds=60

#Anti-replay (defense in depth on top of token): rifiuta i payload con timestamp
#fuori dalla finestra o con nonce gia' visto. ATTIVALO solo dopo aver aggiornato
#TUTTI i client RCON: API/Rcon.php e' gia' fatto; per i ~10 sendMUS del CMS
#bisogna aggiungere 'nonce' => bin2hex(random_bytes(16)) e 'ts' => time() al
#payload JSON, altrimenti vengono rifiutati.
rcon.anti_replay.enabled=false
rcon.anti_replay.window.seconds=30

#SSO ticket hardening (Wave 18).
#TTL del ticket emesso dal CMS-V3 alla pressione di GIOCA. L'EMU rifiuta
#i ticket piu' vecchi di N secondi. Il bootstrap Nitro consuma il ticket
#in <1s al primo handshake → 60s e' margine generoso. Abbassa a 30s in
#produzione ad alta sensibilita'. 0 = nessun TTL (NON raccomandato).
sso.ticket.ttl.seconds=60
#Bind del ticket all'IP del client che ha richiesto /play. L'EMU confronta
#l'IP del peer WebSocket con users.auth_ticket_bound_ip (popolato dal CMS).
#Mismatch → ticket rifiutato (anche se TTL e single-use ok).
#Difesa contro: leak DB read-only, XSS+exfil, MITM su rete diversa.
#Disabilita SOLO se sei dietro un proxy che cambia l'IP tra CMS e EMU
#(es. CGNAT mobile con rotazione IP rapida). Default true.
sso.ticket.bind_ip.enabled=true

#Encryption (RSA used in the client<->server Diffie-Hellman handshake).
#SECURITY: with enc.enabled=false the handshake is unencrypted. The keypair below is the DEFAULT
#Arcturus keypair shipped with every install and is therefore PUBLIC - it provides no real secrecy.
#For production, generate your own RSA keypair and update the matching public key in your client.
enc.enabled=false
enc.e=3
enc.n=86851dd364d5c5cece3c883171cc6ddc5760779b992482bd1e20dd296888df91b33b936a7b93f06d29e8870f703a216257dec7c81de0058fea4cc5116f75e6efc4e9113513e45357dc3fd43d4efab5963ef178b78bd61e81a14c603b24c8bcce0a12230b320045498edc29282ff0603bc7b7dae8fc1b05b52b2f301a9dc783b7
enc.d=59ae13e243392e89ded305764bdd9e92e4eafa67bb6dac7e1415e8c645b0950bccd26246fd0d4af37145af5fa026c0ec3a94853013eaae5ff1888360f4f9449ee023762ec195dff3f30ca0b08b8c947e3859877b5d7dced5c8715c58b53740b84e11fbc71349a27c31745fcefeeea57cff291099205e230e0c7c27e8e1c0512b

#Staff MFA — session TTL (re-challenge MFA dopo timeout)
#Dopo quanti secondi dalla verifica TOTP la sessione MFA scade: il prossimo
#comando staff ri-prompta MFA. Default 14400 = 4h. 0 = nessuna scadenza
#(sessione vive per sempre finche' la connessione resta aperta). Difesa
#contro l'abuso di sessioni staff lunghe rubate ore dopo il login MFA.
staff.mfa.session.ttl.seconds=14400

#Staff MFA — codici di recovery monouso (anti-lockout)
#Lo staff genera i codici via la chat command :mfa_codes (richiede sessione
#gia' MFA-elevated). Storage SHA-256; i codici in chiaro sono mostrati UNA
#volta sola in un popup alert. Usabili al posto del TOTP se si perde
#l'autenticatore. Tabella: staff_mfa_recovery_codes (vedi sqlupdates/).
mfa.staff.recovery.enabled=1
mfa.staff.recovery.count=8

#Device fingerprint — alert in-game su login da nuovo dispositivo
#Quando un fingerprint mai visto si aggiunge a un utente che ne ha gia' altri,
#l'utente riceve un alert "Login da NUOVO dispositivo rilevato..." e viene
#registrato un audit NEW_DEVICE_LOGIN (hash-chain firmata). Il primo login
#assoluto NON genera notifica (no rumore).
fingerprint.alert.new_device.enabled=true

#Alert webhook — pipeline async Discord/Slack agganciata ad AuditLog
#Ogni voce di audit critica (MULTIACCOUNT_DETECTED, NEW_DEVICE_LOGIN,
#PLUGIN_REJECTED, PLUGIN_ALLOWLIST_OFF, STAFF_MFA_LOCKED, STAFF_MFA_RECOVERY_*,
#RCON, GIVE_*, SET_RANK, ecc.) genera un POST JSON al webhook configurato.
#Filtro per tipo evento via CSV o "*" = tutti. Vuoto -> nessun alert (zero
#chiamate HTTP esterne).
#
#Esempio per ricevere SOLO gli eventi di sicurezza critici:
#  alerts.webhook.url    = https://discord.com/api/webhooks/.../slack
#  alerts.webhook.events = MULTIACCOUNT_DETECTED,NEW_DEVICE_LOGIN,PLUGIN_REJECTED,STAFF_MFA_LOCKED,STAFF_MFA_RECOVERY_OK,RCON
#
#alerts.webhook.secret firma il body con HMAC-SHA-256 e lo invia nell'header
#X-Habbo-Signature: il ricevitore puo' validarlo per essere certo che la
#chiamata provenga davvero dall'EMU.
alerts.webhook.url=
alerts.webhook.events=
alerts.webhook.timeout.ms=3000
alerts.webhook.secret=

#Plugin loader — allowlist SHA-256
#Quando enforce_allowlist=true, solo i jar in ./plugins il cui nome+SHA-256
#combaciano con la lista plugins.allowed vengono caricati; gli altri sono
#rifiutati e audit-loggati (PLUGIN_REJECTED). Quando enforce e' false (default)
#vengono caricati tutti, MA all'avvio l'EMU logga un WARN visibile con gli
#SHA-256 di ognuno (comodo per popolare poi l'allowlist).
#Esempio:
#  plugins.enforce_allowlist=true
#  plugins.allowed=NitroWebsockets-3.1.jar=<sha256>,Altro.jar=<sha256>
plugins.enforce_allowlist=false
plugins.allowed=