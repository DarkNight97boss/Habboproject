# CodeQL static analysis — Java/Kotlin (EMU) + JavaScript/TypeScript (CMS-V3 + Nitro).
#
# Gira a ogni push su main + ogni PR + settimanale (drift detection sui CVE
# che escono dopo la nostra patch). I finding appaiono in Security →
# Code scanning alerts sul repo GitHub.
#
# Strategia query suite: security-extended + security-and-quality (vale anche i
# bug "ad alto rumore" come hardcoded password / weak crypto / XSS).
# Matrix:
#   - java-kotlin           → richiede build Maven (JDK 11, come storico).
#   - javascript-typescript → nessun build, CodeQL analizza il source.

name: CodeQL

on:
  push:
    branches: [ "main" ]
    paths:
      - 'EMU/**'
      - 'CMS-V3/**'
      - 'strumenti/Nitro-V3/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'EMU/**'
      - 'CMS-V3/**'
      - 'strumenti/Nitro-V3/**'
  schedule:
    # Lunedì alle 06:00 UTC (08:00 Roma).
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
          - language: javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build EMU (Java)
        if: matrix.language == 'java-kotlin'
        run: |
          cd EMU
          mvn -B -DskipTests -Dmaven.javadoc.skip=true package

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
