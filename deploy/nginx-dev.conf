# ============================================================================
# nginx-dev.conf  -  Server blocks per ambiente DEV (dev.asteriacore.online)
# ----------------------------------------------------------------------------
# Path target sul VPS:  /etc/nginx/sites-available/asteria-dev.conf
# Symlink:              /etc/nginx/sites-enabled/asteria-dev.conf
#
# Architettura:
#   - Cloudflare Tunnel "asteria" -> 127.0.0.1:80 (stesso tunnel del prod)
#   - Hostname pubblici dev gestiti da Public Hostname routes CF:
#       dev.asteriacore.online        -> http://localhost:80  (Host header passa)
#       dev-api.asteriacore.online    -> http://localhost:80
#       dev-hotel.asteriacore.online  -> http://localhost:80  (con websocket)
#   - nginx fa il routing per Host header e proxa ai servizi systemd "*-dev"
#
# Servizi backend dev (paralleli al prod, porte +1):
#   - cms-api-dev.service       -> 127.0.0.1:8093   (prod: 8092)
#   - habbo-emu-dev.service     -> WS 127.0.0.1:2097 (prod: 2096)
#   - frontend statico:         /opt/habboproject-dev/CMS-V3/apps/web/dist
#
# DB:    ms_dev (drop+create a ogni PR per test idempotenti)
# Logs:  /var/log/nginx/asteria-dev-*.log (separati dal prod)
# ============================================================================


# ----------------------------------------------------------------------------
# Rate limiting zones (dedicate al dev, prefisso "dev_" per non collidere col prod)
# Più rilassate del prod perchè qui giriamo test/QA che possono burstare.
# ----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=dev_general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=dev_auth:10m    rate=20r/s;


# ----------------------------------------------------------------------------
# Real IP da Cloudflare Tunnel
# Il tunnel si connette da 127.0.0.1 (cloudflared gira sul VPS stesso),
# quindi ci fidiamo solo del loopback e leggiamo l'IP vero del client
# dall'header CF-Connecting-IP iniettato da Cloudflare edge.
# ----------------------------------------------------------------------------
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header   CF-Connecting-IP;
real_ip_recursive on;


# ----------------------------------------------------------------------------
# Map per gestire correttamente l'upgrade WebSocket sul backend EMU.
# (definita una volta sola, riutilizzata dal server hotel)
# ----------------------------------------------------------------------------
map $http_upgrade $dev_connection_upgrade {
    default upgrade;
    ''      close;
}


# ============================================================================
# SERVER 1:  dev.asteriacore.online
# Frontend statico Vite buildato (apps/web/dist). SPA fallback su index.html.
# ============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name dev.asteriacore.online;

    # --- Logging dedicato dev ---------------------------------------------
    access_log /var/log/nginx/asteria-dev-frontend-access.log;
    error_log  /var/log/nginx/asteria-dev-frontend-error.log warn;

    # --- Document root: bundle Vite buildato dalla pipeline CI ------------
    root  /opt/habboproject-dev/CMS-V3/apps/web/dist;
    index index.html;

    # --- Sicurezza base + anti-SEO (questo è dev, NON deve essere indicizzato)
    add_header X-Robots-Tag         "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff"                                always;
    add_header X-Frame-Options        "SAMEORIGIN"                             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"        always;

    # --- NO CACHE: il bundle dev cambia ad ogni push sulla PR -------------
    # Niente immutable, niente long max-age: vogliamo sempre l'ultima build.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma        "no-cache"                            always;
    add_header Expires        "0"                                  always;

    # --- Rate limit generale ----------------------------------------------
    limit_req zone=dev_general burst=200 nodelay;

    # Body size generoso (upload avatar/asset durante test) ----------------
    client_max_body_size 25M;

    # --- Healthcheck interno (per CI / smoke test) ------------------------
    location = /healthz {
        access_log off;
        return 200 "dev-ok\n";
        add_header Content-Type text/plain;
    }

    # --- Robots.txt esplicito (cintura + bretelle oltre a X-Robots-Tag) ---
    location = /robots.txt {
        access_log off;
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # --- Asset statici (JS/CSS/img/font) ----------------------------------
    # Nessuna cache lunga: forziamo no-cache anche qui per coerenza dev.
    location ~* \.(?:js|mjs|css|map|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        add_header X-Robots-Tag  "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --- SPA fallback (React Router lato client) --------------------------
    # Qualsiasi path non corrisponda a un file -> serviamo index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Nasconde file sensibili eventualmente finiti nel dist ------------
    location ~ /\.(?!well-known) { deny all; }
}


# ============================================================================
# SERVER 2:  dev-api.asteriacore.online
# Reverse proxy verso CMS-V3 API (Hono su Node) -> systemd cms-api-dev.service
# ============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name dev-api.asteriacore.online;

    # --- Logging dedicato -------------------------------------------------
    access_log /var/log/nginx/asteria-dev-api-access.log;
    error_log  /var/log/nginx/asteria-dev-api-error.log warn;

    # --- Header globali ---------------------------------------------------
    add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "no-referrer"                  always;
    # API risposte non cacheabili in dev
    add_header Cache-Control          "no-cache, no-store, must-revalidate" always;

    # --- Rate limit -------------------------------------------------------
    # General: 100 r/s con burst, sufficiente per il polling del frontend.
    limit_req zone=dev_general burst=200 nodelay;

    # Body size (upload furni / room data durante test) --------------------
    client_max_body_size 50M;

    # --- Healthcheck nginx-level (NON proxy, risponde 200 anche se API down)
    # Utile alla pipeline per distinguere "nginx vivo" da "API morta".
    location = /healthz {
        access_log off;
        return 200 "dev-api-nginx-ok\n";
        # healthcheck text/plain: nessun header di sicurezza richiesto
        add_header Content-Type text/plain; # nosemgrep
    }

    # --- Endpoint auth con rate limit più stretto -------------------------
    # /auth/login, /auth/register, /auth/mfa, ecc. -> zone dev_auth (20 r/s)
    location ~ ^/(auth|api/auth|login|register|mfa) {
        limit_req zone=dev_auth burst=40 nodelay;

        proxy_pass         http://127.0.0.1:8093;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Propaga il CF-Connecting-IP grezzo all'app (per audit log)
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Niente buffering sulle risposte auth (latenza più bassa)
        proxy_buffering off;
    }

    # --- Catch-all: tutti gli altri path -> backend Hono ------------------
    location / {
        proxy_pass         http://127.0.0.1:8093;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # SSE/long-poll friendly
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Disabilito buffering: stream JSON / SSE arrivano subito al client
        proxy_buffering off;
        proxy_request_buffering off;
    }
}


# ============================================================================
# SERVER 3:  dev-hotel.asteriacore.online
# WebSocket reverse proxy verso EMU Java -> habbo-emu-dev.service su :2097
# Questo è il canale che Nitro V3 client apre per giocare in gameroom.
# ============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name dev-hotel.asteriacore.online;

    # --- Logging dedicato -------------------------------------------------
    access_log /var/log/nginx/asteria-dev-hotel-access.log;
    error_log  /var/log/nginx/asteria-dev-hotel-error.log warn;

    # --- Header globali (anti-SEO) ----------------------------------------
    add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # --- Rate limit più alto: i client legittimi aprono 1 sola WS, ma -----
    # i probe/scan da fuori sono inevitabili. 100 r/s general basta.
    limit_req zone=dev_general burst=300 nodelay;

    # WS frame possono essere grandi (asset gameroom)
    client_max_body_size 100M;

    # --- Healthcheck nginx-level ------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "dev-hotel-nginx-ok\n";
        # healthcheck text/plain: nessun header di sicurezza richiesto
        add_header Content-Type text/plain; # nosemgrep
    }

    # --- WebSocket upgrade verso EMU --------------------------------------
    # IMPORTANTE: Upgrade + Connection $dev_connection_upgrade per HTTP/1.1
    # e timeout lunghi (1h) perchè una sessione di gioco resta aperta.
    location / {
        proxy_pass         http://127.0.0.1:2097;
        proxy_http_version 1.1;

        # Headers obbligatori per upgrade WebSocket -----------------------
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $dev_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # Timeout: una sessione di gioco può durare ore.
        # 3600s = 1h di idle prima di tagliare la WS.
        proxy_connect_timeout 30s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # MAI bufferizzare un WebSocket
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}

# ============================================================================
# Note operative:
# - Reload nginx:   sudo nginx -t && sudo systemctl reload nginx
# - Verifica routing Host: curl -H "Host: dev-api.asteriacore.online" http://127.0.0.1/healthz
# - Tail log dev:    sudo tail -F /var/log/nginx/asteria-dev-*.log
# - Servizi dev:    systemctl status cms-api-dev habbo-emu-dev
# ============================================================================
