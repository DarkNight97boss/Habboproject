# CI — quality gates su CMS-V3 (typecheck · lint · test · build).
#
# Gira su ogni PR verso main e su push a main che toccano CMS-V3/**.
# Oggi l'unico "check" prima del deploy DEV era che il build non esplodesse:
# questo workflow aggiunge typecheck TypeScript, lint e test PRIMA del deploy,
# così codice rotto viene bloccato in PR e non arriva mai su dev.asteriacore.online.
#
# Note:
#  - Monorepo yarn workspaces (apps/web + apps/api). `yarn <script>` alla root
#    fa fan-out su tutti i workspace (vedi CMS-V3/package.json).
#  - `test` usa --passWithNoTests finché non esistono suite vitest (vedi
#    package.json dei workspace) → verde anche senza test, rosso se un test fallisce.

name: CI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMS-V3/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'CMS-V3/**'
  workflow_dispatch:

# Una run per ref: un nuovo push cancella la precedente (risparmio minuti).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cms-v3:
    name: CMS-V3 · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CMS-V3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: CMS-V3/yarn.lock

      - name: Install (frozen lockfile)
        run: yarn install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test (vitest)
        run: yarn test

      - name: Build (web + api)
        run: yarn build
