# =============================================================================
# VPS - Diagnostica read-only (workflow_dispatch)
# -----------------------------------------------------------------------------
# Esegue sul VPS, con la stessa deploy key della pipeline, un set FISSO di
# comandi di sola lettura (versioni Java, pacchetti Temurin, alternatives,
# stato unit systemd, memoria/disco). Serve a verificare prerequisiti di
# deploy (es. JRE 25) senza aprire sessioni SSH manuali.
#
# Sicurezza:
#   - nessun input: NON e' un "esegui comando arbitrario sul VPS"
#   - solo attori in PROD_DEPLOY_ALLOWLIST (stessa lista di prod-deploy)
#   - permissions: contents:read; VPS_HOST/VPS_USER da secret (mascherati)
#   - il repo e' pubblico -> il log e' pubblico: stampiamo SOLO versioni/stati,
#     e mascheriamo comunque pattern tipo password/token nelle righe stampate
# =============================================================================
name: VPS - Diagnostica read-only

on:
  workflow_dispatch:

concurrency:
  group: vps-diag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diag:
    name: Diagnostica VPS (read-only)
    runs-on: ubuntu-latest
    if: contains(fromJSON(vars.PROD_DEPLOY_ALLOWLIST), github.actor)
    steps:
      - name: Setup ssh-agent con chiave deploy
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configura known_hosts (host pinning)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Diagnostica remota (sola lettura)
        run: |
          set -uo pipefail
          # Maschera difensiva su eventuali segreti nelle righe stampate.
          MASK='s/(-p|--password[= ]|[Pp]ass(word)?[=:]|PWD=|[Ss]ecret[A-Za-z_]*[=:]|[Tt]oken[A-Za-z_]*[=:])[^ "'"'"']*/\1***/g'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE_SCRIPT' | sed -E "$MASK"
          set -uo pipefail
          sec() { echo; echo "===== $* ====="; }
          sec "OS / uptime"
          . /etc/os-release 2>/dev/null && echo "$PRETTY_NAME ($VERSION_CODENAME)"; uptime
          sec "java -version (default)"
          java -version 2>&1 || echo "java: NON trovato nel PATH"
          echo "readlink /usr/bin/java -> $(readlink -f /usr/bin/java 2>/dev/null || echo 'n/d')"
          sec "update-alternatives java"
          update-alternatives --list java 2>&1 || echo "nessuna alternative registrata"
          sec "JVM installate (/usr/lib/jvm)"
          ls -1 /usr/lib/jvm 2>/dev/null || echo "/usr/lib/jvm assente"
          sec "pacchetti temurin / openjdk installati"
          dpkg-query -W -f='${Package}\t${Version}\t${Status}\n' 'temurin-*' 'openjdk-*' 2>/dev/null | grep -v 'not-installed' || echo "nessuno"
          sec "repo Adoptium"
          ls -l /etc/apt/sources.list.d/adoptium.list /etc/apt/keyrings/adoptium.gpg 2>&1
          cat /etc/apt/sources.list.d/adoptium.list 2>/dev/null
          echo "--- apt-cache policy temurin-25-jre ---"
          apt-cache policy temurin-25-jre 2>&1 | head -6
          sec "unit systemd"
          for u in habbo-emu habbo-emu-dev cms-api cms-api-dev cloudflared nginx mariadb; do
            printf '%-14s active=%-9s enabled=%s\n' "$u" "$(systemctl is-active "$u" 2>/dev/null)" "$(systemctl is-enabled "$u" 2>/dev/null)"
          done
          sec "ExecStart delle unit EMU (quale java usano)"
          grep -H '^ExecStart' /etc/systemd/system/habbo-emu.service /etc/systemd/system/habbo-emu-dev.service 2>&1
          sec "unit EMU: ExecStart completo (flag JVM) e sandbox systemd"
          for u in habbo-emu habbo-emu-dev; do echo "--- $u"; systemctl cat "$u" 2>/dev/null | grep -vE '^\s*#|^\s*$' | grep -E 'ExecStart|^\s+-|NoNewPrivileges|Protect|Private|ReadWritePaths|Restrict|CapabilityBoundingSet|SystemCallFilter|LimitNOFILE|MemoryMax|OOM' | cut -c1-160; done
          sec "avvisi JVM all'avvio corrente (Unsafe / native access / restricted / WARNING)"
          for u in habbo-emu habbo-emu-dev; do echo "--- $u (invocazione corrente)"; INV=$(systemctl show -p InvocationID --value "$u" 2>/dev/null); sudo journalctl -u "$u" _SYSTEMD_INVOCATION_ID="$INV" --no-pager -o cat 2>/dev/null | head -60 | grep -iE 'unsafe|native access|restricted|warning|deprecat|jni|rejected|invalidclass|serialfilter|outofmemory|picked up' | head -10 | cut -c1-200; done
          sec "nginx: conf attive vs deploy/nginx-prod.conf del repo (solo hash e righe di diff)"
          REF_URL="https://raw.githubusercontent.com/DarkNight97boss/Habboproject/main/deploy/nginx-prod.conf"
          REF_OLD="https://raw.githubusercontent.com/DarkNight97boss/Habboproject/2b99ab879/deploy/nginx-prod.conf"
          curl -fsSL "$REF_URL" -o /tmp/nginx-repo.conf 2>/dev/null && curl -fsSL "$REF_OLD" -o /tmp/nginx-repo-old.conf 2>/dev/null || echo "(raw non raggiungibile)"
          for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf; do [ -f "$f" ] || continue; printf '%s: %s righe, diff vs repo(main)=%s righe, diff vs repo(pre-#210)=%s righe\n' "$f" "$(wc -l < "$f")" "$(diff "$f" /tmp/nginx-repo.conf 2>/dev/null | grep -c '^[<>]')" "$(diff "$f" /tmp/nginx-repo-old.conf 2>/dev/null | grep -c '^[<>]')"; done
          sec "processi java in esecuzione"
          ps -o pid,user,etimes,rss,args -C java 2>/dev/null | cut -c1-170 || echo "nessun processo java"
          sec "firewall / porte in ascolto (superficie esterna)"
          echo "-- ufw:"; sudo ufw status verbose 2>/dev/null | head -20 || echo "ufw n/d"
          echo "-- fail2ban:"; sudo fail2ban-client status 2>/dev/null | head -5 || echo "fail2ban n/d"
          echo "-- socket in ascolto su 0.0.0.0/:: (NON solo loopback):"; sudo ss -ltnH 2>/dev/null | awk '$4 !~ /^127\.|^\[::1\]|^\[::ffff:127/ {print $4}' | sort -u | sed 's/^/  /'
          echo "-- sshd: PasswordAuthentication/PermitRootLogin effettivi:"; sudo sshd -T 2>/dev/null | grep -iE '^(passwordauthentication|permitrootlogin|kbdinteractiveauthentication|allowusers|port) ' || echo "sshd -T n/d"
          sec "memoria / disco"
          free -m | head -2; df -h / | tail -1
          sec "release DEV (web/api): current -> ? e ultime release per mtime"
          for d in /var/www/dev.asteriacore.online /opt/asteria-cms-api-dev; do
            echo "$d/current -> $(readlink -f "$d/current" 2>/dev/null || echo 'n/d (link rotto?)')"
            ls -1t "$d/releases" 2>/dev/null | head -4 | sed 's/^/  release: /'
          done
          sec "journal dev (ultime righe): cms-api-dev / habbo-emu-dev"
          sudo journalctl -u cms-api-dev -n 12 --no-pager -o cat 2>&1 | cut -c1-160
          echo "--- habbo-emu-dev ---"
          sudo journalctl -u habbo-emu-dev -n 6 --no-pager -o cat 2>&1 | cut -c1-160
          # Exit esplicito: lo status dell'ssh e' quello dell'ultimo comando remoto e
          # un check fallito (es. file non leggibile) non deve far fallire la diagnostica.
          exit 0
          REMOTE_SCRIPT
          echo; echo "[diag] exit ssh: ${PIPESTATUS[0]}"
