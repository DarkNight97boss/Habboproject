name: ✨ Feature request
description: Proponi una nuova funzionalità o miglioria
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema / motivazione
      description: Quale esigenza risolve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Soluzione proposta
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - EMU (game server)
        - CMS-V3 web
        - CMS-V3 api
        - Nitro client
        - Deploy / Infra
        - Altro
