# Esperimento SOLO DEV (installato da apply-dev.sh, non da prod-deploy):
# JEP 519 (Java 25, flag di prodotto): header degli oggetti da 12 a 8 byte ->
# ~10-20% di heap in meno e cache piu' calde. Per systemd l'ultimo Environment=
# della stessa variabile vince, quindi ripetiamo TUTTE le opzioni del drop-in
# base (java25-hardening.conf) piu' la nuova. Il nome "zz-" garantisce che venga
# applicato DOPO java25-hardening.conf (ordine lessicale). Se regge, va nel base.
[Service]
Environment="JDK_JAVA_OPTIONS=--enable-native-access=ALL-UNNAMED -Djdk.serialFilter=!* -XX:+ExitOnOutOfMemoryError -XX:+UseCompactObjectHeaders"
