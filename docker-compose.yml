# docker-compose.yml — stack staging/produzione per Habboproject.
#
# Servizi:
#   db     = MariaDB 10.11 LTS (supporto fino a 2028)
#   emu    = Arcturus EMU 3.5.5 (build da EMU/Dockerfile)
#   caddy  = reverse proxy CMS + API + Nitro client + TLS automatico
#
# Avvio:
#   1. cp .env.example .env       (poi popola valori reali)
#   2. cp EMU/config.ini.example EMU/config.ini   (popola db/rcon/hmac)
#   3. docker compose build
#   4. docker compose up -d
#   5. docker compose logs -f emu
#
# Backup DB:
#   docker compose exec db mariadb-dump -u root -p$DB_ROOT_PASSWORD habbo \
#     > backup-$(date +%F).sql
#
# Rete: tutto su rete privata "habbo_net". Solo Caddy espone 80/443
# all'host. EMU game socket (3000) e RCON (3001) restano interni — chi
# vuole esporre il game socket all'esterno deve fare port-forward su 3000
# E proteggerlo con Cloudflare Spectrum.

services:

  db:
    image: mariadb:10.11
    container_name: habbo-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-ms}
      MARIADB_USER: ${DB_USER:-habbo}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=2G"
      - "--innodb-flush-log-at-trx-commit=2"
      - "--innodb-io-capacity=2000"
      - "--max-connections=200"
      - "--slow-query-log=1"
      - "--long-query-time=0.5"
    volumes:
      - db_data:/var/lib/mysql
      - ./EMU/sqlupdates:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - habbo_net
    # NON pubblichiamo 3306 sull'host: il DB e' raggiungibile solo dai
    # servizi sulla rete habbo_net (emu, eventualmente backup-runner).

  emu:
    build:
      context: ./EMU
      dockerfile: Dockerfile
    image: habboproject/emu:local
    container_name: habbo-emu
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Forza connessione al servizio DB Compose, non a "localhost".
      # I valori finiscono in config.ini montato in lettura sotto.
      JAVA_OPTS: ${EMU_JAVA_OPTS:--Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+AlwaysPreTouch -XX:+ExitOnOutOfMemoryError -Dio.netty.allocator.type=pooled}
    volumes:
      # Config & HMAC secret iniettati da host. Editarli, riavviare il container.
      - ./EMU/config.ini:/habbo/config.ini:ro
      - emu_logs:/habbo/logging
      - emu_dumps:/habbo/dumps
    ports:
      # Game socket esposto sull'host. In prod metti Cloudflare Spectrum
      # davanti e configura networking.tcp.proxy=true in config.ini.
      - "${EMU_GAME_PORT:-3000}:3000"
      # RCON socket: NON esporlo (resta solo su rete interna habbo_net per
      # parlare con API). Commentare la riga sotto se non serve.
      # - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1:9090/readyz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - habbo_net

  caddy:
    image: caddy:2-alpine
    container_name: habbo-caddy
    restart: unless-stopped
    depends_on:
      - emu
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./CMS:/srv/cms:ro
      - ./API:/srv/api:ro
      - ./CMS/react:/srv/client:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - habbo_net

  # ============= Redis (profilo "redis") =============
  # Backing store opzionale per rate-limit cross-instance + session cache.
  # Necessario solo se l'emulatore gira su >1 nodo. Single-node lo lasci off.
  # Abilita con: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: habbo-redis
    restart: unless-stopped
    profiles: ["redis"]
    command:
      - "redis-server"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""  # disable RDB snapshot (rate-limit state e' ephemeral)
      - "--appendonly"
      - "no"
      - "--requirepass"
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    volumes:
      - redis_data:/data
    networks:
      - habbo_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============= Observability (profilo "obs") =============
  # Abilita con: docker compose --profile obs up -d
  # Prometheus scraper + Grafana con dashboard auto-provisioned.
  # I container NON sono esposti sull'host: chi vuole vedere Grafana fa
  # `docker compose port grafana 3000` o passa da reverse proxy Caddy.

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: habbo-prometheus
    restart: unless-stopped
    profiles: ["obs"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.listen-address=:9091"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus_rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - habbo_net
    # Espone su loopback dell'host (per query manuali); MAI 0.0.0.0:9091.
    ports:
      - "127.0.0.1:9091:9091"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: habbo-alertmanager
    restart: unless-stopped
    profiles: ["obs"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - habbo_net
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: habbo-grafana
    restart: unless-stopped
    profiles: ["obs"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Disabilita feed news / phone home.
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - habbo_net
    ports:
      - "127.0.0.1:3030:3000"

  # Backup runner: cron giornaliero mysqldump -> volume montato sul host.
  # Disabilitato di default (profilo "backup"); abilita con:
  #   docker compose --profile backup up -d
  backup:
    image: mariadb:10.11
    container_name: habbo-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-ms}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          /backup.sh
        done
    networks:
      - habbo_net

volumes:
  db_data:
  emu_logs:
  emu_dumps:
  caddy_data:
  caddy_config:
  backup_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  redis_data:

networks:
  habbo_net:
    driver: bridge
